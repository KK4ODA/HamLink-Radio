<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HamLink Radio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 75H1200M0 150H1200M0 225H1200"/>
    <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300M900 0V300M1050 0V300"/>
  </g>
  <!-- glow behind mark -->
  <circle cx="190" cy="150" r="140" fill="url(#glow)"/>
  <!-- app mark -->
  <rect x="120" y="80" width="140" height="140" rx="34" fill="url(#mark)"/>
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <path d="M164 133a37 37 0 0 1 52 0"/>
    <path d="M150 119a55 55 0 0 1 80 0"/>
    <path d="M190 161v36"/>
  </g>
  <circle cx="190" cy="156" r="11" fill="#ffffff"/>
  <!-- signal arcs on the right -->
  <g fill="none" stroke="#34d399" stroke-opacity="0.18" stroke-width="3">
    <path d="M1010 150a90 90 0 0 1 90 -90"/>
    <path d="M980 150a120 120 0 0 1 120 -120"/>
    <path d="M950 150a150 150 0 0 1 150 -150"/>
  </g>
  <!-- title -->
  <text x="320" y="142" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">HamLink Radio</text>
  <text x="322" y="188" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#a7b4c6">Family check-ins over ham radio — VarAC · APRS · Winlink</text>
  <!-- channel chips -->
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
    <rect x="322" y="214" width="84" height="30" rx="15" fill="#26204a"/><text x="364" y="234" text-anchor="middle" fill="#a78bfa">VARAC</text>
    <rect x="416" y="214" width="76" height="30" rx="15" fill="#1a2a4a"/><text x="454" y="234" text-anchor="middle" fill="#60a5fa">APRS</text>
    <rect x="502" y="214" width="98" height="30" rx="15" fill="#3a2a0d"/><text x="551" y="234" text-anchor="middle" fill="#fbbf24">WINLINK</text>
    <rect x="610" y="214" width="112" height="30" rx="15" fill="#0f2e24"/><text x="666" y="234" text-anchor="middle" fill="#34d399">PUSHOVER</text>
  </g>
</svg>
